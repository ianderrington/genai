name: Secret Scan

# CI backstop for the pre-commit secret scan (sc git hooks run never-commit /
# pre-commit). Uses the gitleaks CLI directly: gitleaks-action@v2 needs a paid
# license on org repos and fails without one.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Build config (gitleaks defaults or repo .gitleaks.toml, plus org key shapes)
        run: |
          if [ -f .gitleaks.toml ]; then
            printf '[extend]\npath = "%s/.gitleaks.toml"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/gitleaks.toml"
          else
            printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          fi
          cat >> "$RUNNER_TEMP/gitleaks.toml" <<'TOML'

          [[rules]]
          id = "supabase-secret-key"
          description = "Supabase secret API key"
          regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
          keywords = ["sb_secret_"]

          [[rules]]
          id = "supabase-access-token"
          description = "Supabase management access token"
          regex = '''\bsbp_[a-f0-9]{40}\b'''
          keywords = ["sbp_"]

          [[rules]]
          id = "jwt-signing-secret"
          description = "JWT signing secret assigned to a JWT_SECRET key"
          regex = '''JWT_SECRET["']?\s*[:=]\s*["']?([A-Za-z0-9+/_]{32,200}={0,2})(?:[^A-Za-z0-9+/_-]|$)'''
          secretGroup = 1
          keywords = ["jwt_secret"]

          [[rules]]
          id = "paddle-api-key"
          description = "Paddle API key"
          regex = '''pdl_(?:live|sdbx)_apikey_[A-Za-z0-9_]{20,}'''
          keywords = ["pdl_live_apikey_", "pdl_sdbx_apikey_"]

          [[rules]]
          id = "paddle-webhook-secret"
          description = "Paddle notification secret"
          regex = '''pdl_ntfset_[A-Za-z0-9_]{20,}'''
          keywords = ["pdl_ntfset_"]

          [[rules]]
          id = "stripe-webhook-secret"
          description = "Stripe webhook signing secret"
          regex = '''\bwhsec_[A-Za-z0-9]{24,}'''
          keywords = ["whsec_"]
          TOML

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # New branch or force-push: the old tip is not in history, so scan
          # only the pushed tip commit rather than the whole history.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            LOG_OPTS="-1 $AFTER"
          else
            LOG_OPTS="${BEFORE}..${AFTER}"
          fi
          gitleaks git --config "$RUNNER_TEMP/gitleaks.toml" --log-opts="$LOG_OPTS" --redact --exit-code 1 --no-banner .

      - name: Scan current tree (weekly / manual)
        if: github.event_name != 'push'
        run: gitleaks dir --config "$RUNNER_TEMP/gitleaks.toml" --redact --exit-code 1 --no-banner .
