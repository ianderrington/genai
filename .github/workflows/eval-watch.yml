name: Eval Tooling Watch

on:
  schedule:
    - cron: '0 5 * * 0'  # Sunday 05:00 UTC — offset from link-checker.yml's Sunday 00:00 to avoid runner collision
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the 21-day rate limit and force a post if any repo has a new release'
        type: boolean
        default: false

jobs:
  eval-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate comparison post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          npm run evals:generate -- $FORCE_FLAG | tee /tmp/eval-generate-output.log
          RESULT=$(grep -o 'EVAL_PIPELINE_RESULT=.*' /tmp/eval-generate-output.log | tail -1 | cut -d= -f2)
          SLUG=$(grep -o 'EVAL_PIPELINE_SLUG=.*' /tmp/eval-generate-output.log | tail -1 | cut -d= -f2)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Commit and push new post
        if: steps.generate.outputs.result == 'published'
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          if [ -z "$GH_PUSH_TOKEN" ]; then
            echo "::error::GH_PUSH_TOKEN is not set — cannot push (main has required PR reviews; the default github.token is not an admin and will likely be rejected). See the plan's Phase 2 human-gated steps."
            exit 1
          fi
          git config user.name "eval-watch-bot"
          git config user.email "eval-watch-bot@users.noreply.github.com"
          git add docs/blog/posts scripts/eval-pipeline/state public/images/blog/eval-watch
          git commit -m "chore: eval-watch post ${{ steps.generate.outputs.slug }}"
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Announce (LinkedIn / X / Substack draft)
        if: steps.generate.outputs.result == 'published'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SUBSTACK_POST_ADDRESS: ${{ secrets.SUBSTACK_POST_ADDRESS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EVAL_PIPELINE_SLUG: ${{ steps.generate.outputs.slug }}
        run: npm run evals:announce

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RESULT="${{ steps.generate.outputs.result }}"
          SLUG="${{ steps.generate.outputs.slug }}"
          if [ "$RESULT" = "published" ]; then
            MSG="Eval Watch: published a new comparison post ($SLUG). https://www.managen.ai/blog/posts/$SLUG — Substack draft created if configured, review and publish manually."
          elif [ "$RESULT" = "skipped" ]; then
            MSG="Eval Watch: no post this cycle (quality gate declined — see workflow log for the exact reason)."
          else
            MSG="Eval Watch: run failed. Check the workflow log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          npm run evals:notify -- "$MSG"
